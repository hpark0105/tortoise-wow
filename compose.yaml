name: tortoise-local

x-server: &server
  image: tortoise-local:dev
  build:
    context: .
    args:
      BUILD_JOBS: ${BUILD_JOBS:-2}
  environment:
    DB_PASSWORD: ${DB_PASSWORD:?Run docker/setup.ps1 first}
  depends_on:
    db:
      condition: service_healthy
  stop_grace_period: 2m

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run docker/setup.ps1 first}
      DB_PASSWORD: ${DB_PASSWORD:?Run docker/setup.ps1 first}
    volumes:
      - database:/var/lib/mysql
      - ./sql:/bootstrap/sql:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-tortoise.sh:ro
      - ./docker/init-db-updates.sh:/docker-entrypoint-initdb.d/20-apply-database-updates.sh:ro
      - ./docker:/ops:ro
      - ./local/backups:/backups
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5m
    stop_grace_period: 2m

  realmd:
    <<: *server
    command: [realm]
    ports:
      - "127.0.0.1:3724:3724"
    volumes:
      - realm-state:/state

  world:
    <<: *server
    command: [world]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Run docker/setup.ps1 first}
      PLAYERBOT_ENABLE: ${PLAYERBOT_ENABLE:-0}
      PLAYERBOT_MIN_BOTS: ${PLAYERBOT_MIN_BOTS:-0}
      PLAYERBOT_MAX_BOTS: ${PLAYERBOT_MAX_BOTS:-0}
      PLAYERBOT_OWNED_WORLD_TARGET: ${PLAYERBOT_OWNED_WORLD_TARGET:-0}
      PLAYERBOT_OWNED_WORLD_PACE_MS: ${PLAYERBOT_OWNED_WORLD_PACE_MS:-5000}
      PLAYERBOT_ZONE_WORLD_TARGET: ${PLAYERBOT_ZONE_WORLD_TARGET:-0}
      PLAYERBOT_ZONE_WORLD_PACE_MS: ${PLAYERBOT_ZONE_WORLD_PACE_MS:-5000}
      PLAYERBOT_ZONE_WORLD_RADIUS_YD: ${PLAYERBOT_ZONE_WORLD_RADIUS_YD:-250}
      PLAYERBOT_WORLD_INTENT_ENABLE: ${PLAYERBOT_WORLD_INTENT_ENABLE:-0}
      PLAYERBOT_WORLD_INTENT_INTERVAL_MS: ${PLAYERBOT_WORLD_INTENT_INTERVAL_MS:-600000}
      PLAYERBOT_WORLD_INTENT_GLOBAL_PACE_MS: ${PLAYERBOT_WORLD_INTENT_GLOBAL_PACE_MS:-10000}
      PLAYERBOT_REFRESH: ${PLAYERBOT_REFRESH:-60000}
      PLAYERBOT_UPDATE_MS: ${PLAYERBOT_UPDATE_MS:-10000}
      PLAYERBOT_DEBUG: ${PLAYERBOT_DEBUG:-0}
      PLAYERBOT_PROVISION: ${PLAYERBOT_PROVISION:-}
      PLAYERBOT_ZONE_PROVISION: ${PLAYERBOT_ZONE_PROVISION:-}
      PLAYERBOT_ZONE_PROVISION_LEVEL: ${PLAYERBOT_ZONE_PROVISION_LEVEL:-1}
      PLAYERBOT_OWNER_ACCOUNT_ID: ${PLAYERBOT_OWNER_ACCOUNT_ID:-0}
      PLAYERBOT_QUEST_ID: ${PLAYERBOT_QUEST_ID:-0}
      PLAYERBOT_COOPERATIVE_QUEST_ID: ${PLAYERBOT_COOPERATIVE_QUEST_ID:-0}
      PLAYERBOT_MIRROR_OWNER_QUESTS: ${PLAYERBOT_MIRROR_OWNER_QUESTS:-0}
      PLAYERBOT_PERSONALITY_PROFILE: ${PLAYERBOT_PERSONALITY_PROFILE:-none}
      PLAYERBOT_PLANNER_SERVICE_URL: ${PLAYERBOT_PLANNER_SERVICE_URL:-}
      PLAYERBOT_CONVERSATION_SERVICE_URL: ${PLAYERBOT_CONVERSATION_SERVICE_URL:-}
      PERF_PROCESSING_TELEMETRY: ${PERF_PROCESSING_TELEMETRY:-0}
      PLAYER_SAVE_INTERVAL: ${PLAYER_SAVE_INTERVAL:-60000}
    ports:
      - "127.0.0.1:8085:8085"
    stdin_open: true
    tty: true
    volumes:
      - world-state:/state
      - ./data:/data:ro

volumes:
  database:
  realm-state:
  world-state:
